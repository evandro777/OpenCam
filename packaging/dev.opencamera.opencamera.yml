app-id: dev.opencamera.opencamera
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: opencamera
finish-args:
  - --share=network # RTSP / ONVIF to the cameras
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets # flutter_secure_storage keyring

modules:
  # The runtime has no libmpv, and media_kit_libs_linux does not bundle it.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --disable-debug
    sources:
      - type: archive
        url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.1.tar.gz
        sha256: f117507dc501f2a6c11f9241d8d0c3213846cfad91764361af37befd6b6c523d

  - name: libass
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: jsoncpp # needed by flutter_secure_storage_linux
    buildsystem: meson
    config-opts: [-Dtests=false]
    sources:
      - type: git
        url: https://github.com/open-source-parsers/jsoncpp.git
        tag: 1.9.6

  - name: libplacebo # hard dependency of mpv >= 0.37
    buildsystem: meson
    config-opts: [-Dvulkan=disabled, -Ddemos=false, -Dtests=false]
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.349.0

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.39.0.tar.gz
        sha256: 2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683

  - name: opencamera
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opencamera
      - tar --no-same-owner -xzf opencamera-linux-x64.tar.gz -C /app/opencamera
      - mkdir -p /app/bin
      - ln -s /app/opencamera/opencamera /app/bin/opencamera
      - install -Dm644 dev.opencamera.opencamera.desktop /app/share/applications/dev.opencamera.opencamera.desktop
      - install -Dm644 dev.opencamera.opencamera.metainfo.xml /app/share/metainfo/dev.opencamera.opencamera.metainfo.xml
      - install -Dm644 dev.opencamera.opencamera.png /app/share/icons/hicolor/192x192/apps/dev.opencamera.opencamera.png
    sources:
      # CI downloads the "linux" artifact into the repo root before building.
      - type: file
        path: ../opencamera-linux-x64.tar.gz
      - type: file
        path: dev.opencamera.opencamera.desktop
      - type: file
        path: dev.opencamera.opencamera.metainfo.xml
      - type: file
        path: dev.opencamera.opencamera.png
