app-id: dev.opencam.opencam
runtime: org.gnome.Platform
runtime-version: "49"
sdk: org.gnome.Sdk
command: opencam
finish-args:
  - --share=network # RTSP / ONVIF to the cameras
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.secrets # flutter_secure_storage keyring

modules:
  # The runtime has no libmpv, and media_kit_libs_linux does not bundle it.
  - name: ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --disable-debug
    sources:
      - type: archive
        url: https://github.com/FFmpeg/FFmpeg/archive/refs/tags/n7.1.1.tar.gz
        sha256: f117507dc501f2a6c11f9241d8d0c3213846cfad91764361af37befd6b6c523d

  - name: libass
    config-opts: [--disable-static]
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.3/libass-0.17.3.tar.xz
        sha256: eae425da50f0015c21f7b3a9c7262a910f0218af469e22e2931462fed3c50959

  - name: jsoncpp # needed by flutter_secure_storage_linux
    buildsystem: meson
    config-opts: [-Dtests=false]
    sources:
      - type: git
        url: https://github.com/open-source-parsers/jsoncpp.git
        tag: 1.9.6
        # A tag can be moved; the commit cannot. Change both when upgrading.
        commit: 89e2973c754a9c02a49974d839779b151e95afd6

  - name: libplacebo # hard dependency of mpv >= 0.37
    buildsystem: meson
    config-opts: [-Dvulkan=disabled, -Ddemos=false, -Dtests=false]
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.349.0
        # Annotated tag: this is the commit it points to (git ls-remote <url> 'refs/tags/v7.349.0^{}').
        commit: 1fd3c7bde7b943fe8985c893310b5269a09b46c5

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dlua=disabled
      - -Djavascript=disabled
    sources:
      - type: archive
        url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.39.0.tar.gz
        sha256: 2ca92437affb62c2b559b4419ea4785c70d023590500e8a52e95ea3ab4554683

  - name: opencam
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opencam
      - tar --no-same-owner -xzf opencam-linux-x64.tar.gz -C /app/opencam
      - mkdir -p /app/bin
      - ln -s /app/opencam/opencam /app/bin/opencam
      - install -Dm644 dev.opencam.opencam.desktop /app/share/applications/dev.opencam.opencam.desktop
      - install -Dm644 dev.opencam.opencam.metainfo.xml /app/share/metainfo/dev.opencam.opencam.metainfo.xml
      - install -Dm644 dev.opencam.opencam.png /app/share/icons/hicolor/192x192/apps/dev.opencam.opencam.png
    sources:
      # CI downloads the "linux" artifact into the repo root before building.
      - type: file
        path: ../opencam-linux-x64.tar.gz
      - type: file
        path: dev.opencam.opencam.desktop
      - type: file
        path: dev.opencam.opencam.metainfo.xml
      - type: file
        path: dev.opencam.opencam.png
