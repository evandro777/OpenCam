name: opencam
description: "Live view, PTZ and SD-card recordings for IP cameras (RTSP / ONVIF)."
publish_to: 'none'

# build-name is the Android versionName, build-number its versionCode.
version: 1.0.4+5

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^23.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
