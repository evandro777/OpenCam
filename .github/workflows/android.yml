name: Android

# Builds the release APK on every push to master and on pull requests, and adds it to the GitHub release
# when a version tag (v1.0.1, ...) is pushed.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(sed -nE 's/^version: *([^+]*).*/\1/p' pubspec.yaml)
          [ "${GITHUB_REF_NAME#v}" = "$app" ] || { echo "tag != pubspec $app"; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Release key from secrets (RELEASING.md). Without them (fork PRs, plain
      # master pushes) the APK is debug-signed; a tag must never ship that.
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          OPENCAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENCAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "tag build without the ANDROID_KEYSTORE_B64 secret"; exit 1; fi
            echo "no keystore secret: debug-signed build"; exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "OPENCAM_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "OPENCAM_KEYSTORE_PASSWORD=$OPENCAM_KEYSTORE_PASSWORD"
            echo "OPENCAM_KEY_ALIAS=$OPENCAM_KEY_ALIAS"
          } >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - name: Name the APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || version="${GITHUB_SHA::8}"
          mv build/app/outputs/flutter-apk/app-release.apk "OpenCam-${version}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: OpenCam-*.apk

  release:
    name: Add to release
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes || sleep 20
          gh release upload "$GITHUB_REF_NAME" OpenCam-*.apk --repo "$GITHUB_REPOSITORY" --clobber
